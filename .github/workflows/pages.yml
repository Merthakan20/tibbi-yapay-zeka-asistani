# Ücretsiz statik siteyi (yapay zekâsız kütüphane sürümü) her push'ta GitHub Pages'e yayınlar.
# Ayar: Settings › Pages › Source: "GitHub Actions"
name: Ücretsiz site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Statik siteyi derle
        run: node web/build.mjs --static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site
      - id: deploy
        uses: actions/deploy-pages@v4
